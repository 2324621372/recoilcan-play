.c11-card fieldset{border:0;padding:0;margin:0 0 20px;min-width:0}.c11-card legend{width:100%;font-size:17px;margin-bottom:12px}.c11-languages{display:flex;justify-content:center;gap:7px}.c11-languages button{font-size:14px;flex:1;min-width:0;padding:10px 5px;white-space:nowrap}
#c11-sound{width:100%;margin-bottom:12px;background:var(--ui-surface);color:var(--ui-ink)}#c11-sound::before{content:"";display:inline-block;width:7px;height:7px;border:1px solid currentColor;border-radius:50%;margin-right:9px;vertical-align:2px}#c11-sound[aria-pressed=true]::before{background:var(--ui-caption)}.c11-card .primary{width:100%;font-size:19px;min-height:52px}
#c11-result{position:fixed;left:50%;margin-left:-143px;width:286px;z-index:15;transform-origin:50% 0;pointer-events:none}
#c11-result>button,#c11-result>.riffle-challenge{pointer-events:auto}
#c11-again{width:100%;height:52px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:20px;line-height:1;padding:8px 14px}
#c11-again svg{width:23px;height:23px;flex:none}
#c11-result>:not(#c11-again){position:absolute;top:var(--challenge-top);left:0;width:100%;pointer-events:auto}
@media(hover:hover){.c11-ui button:hover,button.c11-ui:hover{filter:brightness(1.07)}}
@media(prefers-reduced-motion:reduce){.c11-ui button,button.c11-ui{transition:none}}

.c11-ui{--ui-ink:#26202c;--ui-edge:#26202c;--ui-caption:#2a5f8a;--ui-focus:#e8503a;--ui-border:2.5px solid #26202c;--ui-radius:12px;--ui-surface:#fff8e8;--ui-selected:#ffd23a;--ui-selected-ink:#26202c;--ui-card:linear-gradient(#fbf3e2,#efe0c4);--ui-divider:#b5652e66;--ui-shadow:0 3px 0 #26202c55;--ui-card-shadow:4px 6px 0 #17121c77,0 18px 44px #0006;--ui-scrim:#140e18b0;--challenge-top:156px}
.c11-card{padding:0 20px 22px;border:3.5px solid #26202c;border-radius:20px;box-shadow:inset 0 0 0 3px #fff8e880,var(--ui-card-shadow)}
.c11-card h1{position:relative;margin:0 -20px 14px;padding:18px 22px 16px;border-radius:15px 15px 0 0;border-bottom:3px solid #26202c;background:linear-gradient(#3a7ab0,#24577f);color:white;font-size:26px;text-shadow:2px 2px #26202c}
.c11-card h1::before,.c11-card h1::after{content:'';position:absolute;top:13px;width:6px;height:6px;border:1.5px solid #26202c;border-radius:50%;background:#cdd5dd;box-shadow:inset 1px 1px #fff}
.c11-card h1::before{left:10px}.c11-card h1::after{right:10px}
#c11-pause{background:linear-gradient(#4fa3d9,#2a5f8a);color:white;box-shadow:0 3px 0 #26202c88,inset 0 0 0 2px #ffffff22}
#c11-sound[aria-pressed=true]::before{background:#32835f}
#c11-result{width:282px;margin-left:-141px}
#c11-again{background:linear-gradient(#ffe57a,#ffcc33);border-width:3px;border-radius:14px;box-shadow:inset 0 2px 0 #fff5c1,0 4px 0 #26202c99}
